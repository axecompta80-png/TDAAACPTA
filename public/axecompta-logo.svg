<svg viewBox="0 0 500 500" width="500" height="500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for Ribbon 'A' -->
    <linearGradient id="axeRibbonGrad" x1="140" y1="280" x2="310" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#23085A" />
      <stop offset="35%" stop-color="#4C1D95" />
      <stop offset="70%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Gradient for Growth Bars -->
    <linearGradient id="barGrad1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2E1065" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3B0764" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Calculator Gradient -->
    <linearGradient id="calcGrad" x1="290" y1="280" x2="360" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#581C87" />
      <stop offset="60%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7C3AED" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Group Graphic Emblem -->
  <g id="logo-emblem" filter="url(#softGlow)">
    <!-- Main Sweeping Ribbon 'A' -->
    <path
      d="M 148 274 C 138 273 138 260 146 250 C 182 205 214 140 242 104 C 248 96 257 96 262 103 C 288 138 304 175 308 188 C 304 188 288 188 272 188 C 220 188 174 235 148 274 Z"
      fill="url(#axeRibbonGrad)"
    />
    <path
      d="M 148 274 C 172 236 216 190 268 190 C 285 190 300 190 306 189 C 302 178 286 142 262 105 C 257 98 248 98 242 106 C 214 142 182 206 146 252 C 140 260 141 270 148 274 Z"
      fill="none"
      stroke="url(#axeRibbonGrad)"
      stroke-width="3"
    />

    <!-- Bar Chart 1 (Small) -->
    <rect x="210" y="246" width="16" height="34" rx="8" fill="url(#barGrad1)" />

    <!-- Bar Chart 2 (Medium) -->
    <rect x="236" y="228" width="16" height="52" rx="8" fill="url(#barGrad2)" />

    <!-- Bar Chart 3 (Tall) -->
    <rect x="262" y="206" width="16" height="74" rx="8" fill="url(#barGrad3)" />

    <!-- Calculator Device Container -->
    <!-- Outer rounded frame with open left / smooth border -->
    <path
      d="M 300 188 L 340 188 C 352 188 362 198 362 210 L 362 260 C 362 272 352 280 340 280 L 300 280"
      fill="none"
      stroke="url(#calcGrad)"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Calculator Crosshair dividing grid lines -->
    <line x1="322" y1="202" x2="322" y2="266" stroke="url(#calcGrad)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="294" y1="234" x2="350" y2="234" stroke="url(#calcGrad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Mathematical Symbols -->
    <!-- Top-Left: + -->
    <g transform="translate(306, 216)">
      <line x1="-5" y1="0" x2="5" y2="0" stroke="url(#calcGrad)" stroke-width="3.5" stroke-linecap="round" />
      <line x1="0" y1="-5" x2="0" y2="5" stroke="url(#calcGrad)" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Top-Right: - -->
    <g transform="translate(338, 216)">
      <line x1="-6" y1="0" x2="6" y2="0" stroke="url(#calcGrad)" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Bottom-Left: x -->
    <g transform="translate(306, 250)">
      <line x1="-4.5" y1="-4.5" x2="4.5" y2="4.5" stroke="url(#calcGrad)" stroke-width="3.2" stroke-linecap="round" />
      <line x1="4.5" y1="-4.5" x2="-4.5" y2="4.5" stroke="url(#calcGrad)" stroke-width="3.2" stroke-linecap="round" />
    </g>

    <!-- Bottom-Right: = -->
    <g transform="translate(338, 250)">
      <line x1="-5.5" y1="-3" x2="5.5" y2="-3" stroke="url(#calcGrad)" stroke-width="3" stroke-linecap="round" />
      <line x1="-5.5" y1="3" x2="5.5" y2="3" stroke="url(#calcGrad)" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- Typography: AxeCompta -->
  <g id="logo-text">
    <text x="76" y="342" font-family="'Plus Jakarta Sans', 'Outfit', 'Inter', sans-serif" font-size="52" font-weight="900" fill="#200755" letter-spacing="-1">
      Axe<tspan fill="#7024E3" font-weight="700">Compta</tspan>
    </text>
  </g>

  <!-- Subtitle with Flanking Lines: — MAÎTRISE • FIABILITÉ • PERFORMANCE — -->
  <g id="logo-baseline">
    <!-- Left line -->
    <line x1="78" y1="370" x2="108" y2="370" stroke="#250D5A" stroke-width="1.8" stroke-linecap="round" />
    <!-- Slogan Text -->
    <text x="250" y="374" font-family="'Plus Jakarta Sans', 'Outfit', 'Inter', sans-serif" font-size="11" font-weight="800" fill="#250D5A" letter-spacing="3.5" text-anchor="middle">
      MAÎTRISE • FIABILITÉ • PERFORMANCE
    </text>
    <!-- Right line -->
    <line x1="392" y1="370" x2="422" y2="370" stroke="#250D5A" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>
